# CleanSpot static site: SPA fallback, service worker and manifest never cached,
# hashed assets cached for a year. Cookie-free; no logging of query strings beyond the default.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

  # Updates must be found: the service worker and manifest are revalidated every time.
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  # Vite puts hashed files here.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes (/app, /app/report, /datenschutz, ...) are served by index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
